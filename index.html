<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineAI</title>

  <style>
    body{
      background:#000;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      flex-direction:column;
      padding:20px;
    }

    textarea{
      width:90%;
      max-width:500px;
      height:150px;
      border-radius:10px;
      border:none;
      padding:15px;
      font-size:16px;
    }

    button{
      margin-top:20px;
      padding:15px 30px;
      border:none;
      border-radius:10px;
      background:#d4a64f;
      color:black;
      font-weight:bold;
      font-size:18px;
    }
  </style>
</head>

<body>

  <h1>CineAI 🎬</h1>

  <textarea 
    id="prompt" 
    placeholder="Cole links ou escreva seu prompt..."
    oninput="detectarLink(this.value)">
  </textarea>

  <button onclick="gerarVideo()">
    Gerar vídeo
  </button>

  <script>

    async function extrairConteudo(url) {
      try {

        const response = await fetch(
          `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        );

        const html = await response.text();

        console.log("Conteúdo carregado:", html);

        alert("Link detectado com sucesso 🔗");

        return html;

      } catch (erro) {

        console.error("Erro ao carregar link:", erro);

      }
    }

    async function detectarLink(texto) {

      const regex = /(https?:\/\/[^\s]+)/g;

      const links = texto.match(regex);

      if (links && links.length > 0) {

        await extrairConteudo(links[0]);

      }
    }

    function gerarVideo(){

      const texto = document.getElementById("prompt").value;

      alert("Prompt enviado: " + texto);

    }

  </script>

</body>
</html>
